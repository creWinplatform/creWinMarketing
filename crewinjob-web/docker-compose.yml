version: "3.8"

# Kullanım (repo kökünden veya bu klasörden):
#   docker compose -f crewinjob-web/docker-compose.yml up -d --build
# Tüm gizli değerler .env.local'dan okunur (env_file) — burada tekrar listelenmez.

services:
  app:
    build:
      context: ..                       # repo kökü: crewinjob-web + crewinjob-agent
      dockerfile: crewinjob-web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://marketing.crewin.org}
    image: crewinjob-marketing:latest
    container_name: crewinjob-marketing
    restart: unless-stopped
    ports:
      - "3033:3033"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3033
      HOSTNAME: 0.0.0.0
      CREWINJOB_AGENT_DIR: /crewinjob-agent
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://marketing.crewin.org}
    volumes:
      # OAuth token'ları, zamanlanmış postlar vb. (container yeniden başlasa bile kaybolmaz)
      - crewinjob_data:/app/data
      # Blog görsellerinin yerel kopyaları
      - crewinjob_blog_images:/app/public/images/blog
      # Telegram ilan botu verisi (review queue, posted jobs, gruplar)
      - crewinjob_agent_data:/crewinjob-agent/data
    healthcheck:
      # /api/health public'tir (auth gerektirmez)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3033/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  crewinjob_data:
    driver: local
  crewinjob_blog_images:
    driver: local
  crewinjob_agent_data:
    driver: local
